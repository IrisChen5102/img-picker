<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图集助手 · 图片列表</title>
<style>
:root { --accent: #ff6a00; --bg: #faf8f5; --ink: #2b2b2b; --line: #e8e2da; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 16px; padding: 14px 24px; background: rgba(250, 248, 245, 0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
h1 { font-size: 18px; margin: 0; }
#count { color: #8a8178; font-size: 13px; }
.actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }
button { border: none; cursor: pointer; border-radius: 999px; font-size: 13px; padding: 9px 16px; font-family: inherit; }
button.ghost { background: #fff; border: 1px solid var(--line); color: var(--ink); }
button.primary { background: var(--accent); color: #fff; font-weight: 600; }
button.primary:disabled { opacity: 0.6; cursor: wait; }
#status { font-size: 12px; color: #8a8178; min-width: 120px; text-align: right; }
main { padding: 20px 24px 60px; }
#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; position: relative; }
.card img { width: 100%; height: 150px; object-fit: contain; background: #f3efe9; display: block; }
.card .meta { display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 12px; color: #8a8178; }
.card .meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.card .dl { border: none; background: none; color: var(--accent); cursor: pointer; font-size: 12px; padding: 0; font-family: inherit; }
.card input[type=checkbox] { position: absolute; top: 8px; left: 8px; width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
.empty { text-align: center; color: #8a8178; padding: 80px 0; line-height: 2; }
</style>
</head>
<body>
<header>
  <h1>图集助手</h1>
  <span id="count"></span>
  <div class="actions">
    <button class="ghost" id="selectAll">全选</button>
    <button class="ghost" id="selectNone">取消全选</button>
    <button class="primary" id="zip">批量下载 (zip)</button>
    <span id="status"></span>
  </div>
</header>
<main>
  <div id="grid"></div>
  <div class="empty" id="empty" hidden>没有找到图片——回到商品页，先把页面往下滚动一遍让图片加载出来，再点「获取图片」</div>
</main>
<script src="jszip.min.js"></script>
<script src="viewer.js"></script>
</body>
</html>
